[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "library-shared"
version = "0.1.0"
description = "Shared JWT/Redis/CORS infrastructure for the Library Python microservices"
requires-python = ">=3.11"
dependencies = [
    # Same range already used by login and soap.
    "Flask>=3.0,<4.0",
    "PyJWT>=2.8,<3.0",
    "redis>=5.0,<9.0",
    "flask-cors>=4.0,<7.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["library_shared*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
